name: adicionar_item-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout del repo de pruebas (este)
      - name: Checkout ProjetoMestreFinal
        uses: actions/checkout@v3
        with:
          path: ProjetoMestreFinal

      # Checkout del repo del servidor (otro repo)
      - name: Checkout hub-de-leitura-integrado
        uses: actions/checkout@v3
        with:
          repository: fabioaraujoqa/hub-de-leitura
          path: hub-de-leitura-integrado

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   # ⚠️ Cypress 15 requiere Node >=20

      - name: Instalar dependências do servidor
        run: npm ci
        working-directory: hub-de-leitura-integrado

      - name: Instalar dependências das provas
        run: npm ci
        working-directory: ProjetoMestreFinal
      - name: Verificar estructura del servidor
        run: ls -R
        working-directory: hub-de-leitura-integrado
 
      - name: Iniciar servidor principal
        run: |
          nohup node src/server.js &
          sleep 5
        working-directory: hub-de-leitura-integrado

      - name: Rodar testes E2E
        run: npm run test:e2e
        working-directory: ProjetoMestreFinal
        env:
          PORT: 3000

    
  
