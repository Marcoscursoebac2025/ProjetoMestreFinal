name: aidicionar_item-CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ProjetoMestreFinal
        uses: actions/checkout@v3

      - name: Clonar hub-de-leitura-integrado
        run: |
          cd ..
          git clone https://github.com/fabioaraujoqa/hub-de-leitura.git hub-de-leitura-integrado

      - name: Instalar dependências do hub-de-leitura-integrado
        run: |
          cd ../hub-de-leitura-integrado
          npm ci

      - name: Instalar dependências do ProjetoMestreFinal
        run: |
          cd ../ProjetoMestreFinal
          npm ci

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.18.0'

      - name: Rodar testes E2E
        run: npm run test:e2e
        env:
          PORT: 3001


    
  
